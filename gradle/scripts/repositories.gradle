repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://server.cjsah.net:1002/maven/releases/' } }
        filter { includeGroup 'dev.anvilcraft.lib' }
    }
    mavenLocal()
    maven {
        url = 'https://server.cjsah.net:1002/maven/releases/'
        content {
            includeModule('dev.dubhe.map', 'aleeve_atlas-neoforge-1.21.1')
        }
    }
    mavenCentral()
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}
